name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:

permissions:
  contents: read

jobs:
  build-artifacts:
    name: Build artifacts
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repo
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      # Bitwarden.Server.Sdk.Crypto wraps a Rust library built in sdk-internal.
      - name: Fetch Rust SDK native library
        run: extensions/Bitwarden.Server.Sdk.Crypto/scripts/fetch-native.sh --from-pinned linux-x64
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check Rust SDK bindings are up to date
        run: extensions/Bitwarden.Server.Sdk.Crypto/scripts/generate-bindings.sh --check

      - name: Build solution
        run: dotnet build

      - name: Lint
        run: dotnet format --verify-no-changes
